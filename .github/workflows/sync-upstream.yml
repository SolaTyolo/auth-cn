name: Sync Upstream

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-master:
    name: Sync supabase/auth → master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/supabase/auth.git
          git fetch upstream master --tags

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits found."
          fi

      - name: Merge upstream into master
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master

      - name: Create pull request
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore: sync upstream supabase/auth" \
            --body "$(cat <<'EOF'
          ## Summary
          Automated sync from [supabase/auth](https://github.com/supabase/auth) master.

          ## Test plan
          - [ ] CI passes on this PR
          - [ ] After merge, run **Sync CN Branch** workflow or manually merge `master` into `cn`

          See [docs/CN_SYNC.md](../docs/CN_SYNC.md) for the full sync process.
          EOF
          )"
